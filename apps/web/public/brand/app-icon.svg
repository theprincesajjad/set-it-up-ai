<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon master, 1024 x 1024, full bleed (iOS and Android apply their own masks; no rounded corners here).
       Artwork sits inside the central 704 px (Android adaptive-icon safe zone = 66% circle). -->
  <defs>
    <clipPath id="awning">
      <!-- awning band 224..800 wide (4 scallops of 144), top 248, scallop baseline 392 -->
      <path d="M224 300a52 52 0 0 1 52-52h472a52 52 0 0 1 52 52v92a72 72 0 0 1-144 0a72 72 0 0 1-144 0a72 72 0 0 1-144 0a72 72 0 0 1-144 0z"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#1F6A50"/>
  <!-- soft sunlit glow behind the shop -->
  <circle cx="512" cy="540" r="360" fill="#195841"/>
  <!-- shop body -->
  <rect x="248" y="330" width="528" height="446" rx="56" fill="#FAF6EF"/>
  <!-- awning -->
  <g clip-path="url(#awning)">
    <rect x="224" y="248" width="576" height="220" fill="#F5A524"/>
    <rect x="368" y="248" width="144" height="220" fill="#FDDA8E"/>
    <rect x="656" y="248" width="144" height="220" fill="#FDDA8E"/>
  </g>
  <!-- door -->
  <path d="M432 776V600a80 80 0 0 1 160 0v176z" fill="#1F6A50"/>
  <!-- doorknob = the point -->
  <circle cx="556" cy="696" r="18" fill="#F5A524"/>
  <!-- step -->
  <rect x="400" y="776" width="224" height="20" rx="10" fill="#144634"/>
</svg>
