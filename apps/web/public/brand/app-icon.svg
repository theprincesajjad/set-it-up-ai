<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon master, 1024 x 1024, full bleed (iOS and Android apply their own masks; no rounded corners here).
       The stamp sits inside the central 66% circle (Android adaptive-icon safe zone). Near-black #0B0B0B and white. No gradients. -->
  <rect width="1024" height="1024" fill="#0B0B0B"/>
  <circle cx="512" cy="512" r="212" fill="none" stroke="#FFFFFF" stroke-width="62"/>
  <circle cx="512" cy="512" r="88" fill="#FFFFFF"/>
</svg>
