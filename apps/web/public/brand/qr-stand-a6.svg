<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="148mm" viewBox="0 0 105 148" role="img" aria-labelledby="title">
  <title id="title">Counter QR stand: Scan to join</title>
  <!--
    Counter QR stand, A6 portrait (105 x 148 mm), v2 look: white, black type, one accent dot.
    Prints on 4x6" with "fit to page". Units are millimetres. Template fields (replace text content, keep ids):
      #shop-name     {{SHOP_NAME}}     <= 20 chars at font-size 8; 21-30 chars set font-size 6; longer: use the short name
      #street-1      {{SHOP_NAME}} inside "earn points at ..." (max 28 chars, else use "here")
      #street-2      {{STREET_NAME}}   e.g. "Roncesvalles", "the Danforth" (max 22 chars)
      #join-url      {{JOIN_URL}}      short URL without https://, e.g. local.example/j/K7Q4
      #qr-slot       replace the whole <g> with the QR as <path> or <image>, 50 x 50 mm,
                     black on white, error correction M, >= 4 mm quiet zone (the card gives 4 mm)
    Keep every element inside the 6 mm safe margin. The footer band is full-bleed;
    for a print shop add 3 mm bleed by extending it.
    Fonts: Bricolage Grotesque 800 (headline, shop name, wordmark), Inter 500/600 (copy). Outline before print.
  -->

  <!-- paper -->
  <rect width="105" height="148" fill="#FFFFFF"/>

  <!-- mark, top-left on the safe margin -->
  <g transform="translate(8 9) scale(0.125)">
    <rect width="64" height="64" rx="16" fill="#C8452C"/>
    <circle cx="22" cy="22" r="7.5" fill="#FFFFFF"/>
    <circle cx="42" cy="22" r="7.5" fill="#FFFFFF"/>
    <circle cx="22" cy="42" r="7.5" fill="#FFFFFF"/>
    <circle cx="42" cy="42" r="7.5" fill="#FDF0C8"/>
  </g>

  <g text-anchor="middle">
    <!-- shop name -->
    <text id="shop-name" x="52.5" y="33" font-family="'Bricolage Grotesque', Inter, ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="800" letter-spacing="-0.08" fill="#0B0B0C">{{SHOP_NAME}}</text>

    <!-- headline: lowercase, the voice -->
    <text x="52.5" y="46.5" font-family="'Bricolage Grotesque', Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="-0.12" fill="#0B0B0C">scan to join</text>

    <!-- sub copy -->
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="4.2" font-weight="500" fill="#6B6B70">
      <text x="52.5" y="54">earn points at <tspan id="street-1" font-weight="600" fill="#0B0B0C">{{SHOP_NAME}}</tspan></text>
      <text x="52.5" y="59.5">and every shop on <tspan id="street-2" font-weight="600" fill="#0B0B0C">{{STREET_NAME}}</tspan></text>
    </g>
  </g>

  <!-- QR card: 58 mm, hairline, 4 mm quiet zone -->
  <rect x="23.5" y="66" width="58" height="58" rx="4" fill="#FFFFFF" stroke="#E8E8E6" stroke-width="0.35"/>
  <g id="qr-slot">
    <rect x="27.5" y="70" width="50" height="50" fill="none" stroke="#9A9AA0" stroke-width="0.35" stroke-dasharray="2 1.5"/>
    <text x="52.5" y="96.5" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="5" fill="#9A9AA0" text-anchor="middle">QR 50 x 50 mm</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="52.5" y="130.5" font-size="3.6" font-weight="600" fill="#0B0B0C">No app needed · Free · Takes 30 seconds</text>
    <text x="52.5" y="135.5" font-size="3.3" font-weight="500" fill="#6B6B70">No phone camera? Just tell us your number.</text>
  </g>

  <!-- footer band -->
  <rect y="139" width="105" height="9" fill="#0B0B0C"/>
  <circle cx="10" cy="143.5" r="1.4" fill="#FF5A1F"/>
  <text x="13.2" y="144.7" font-family="'Bricolage Grotesque', Inter, ui-sans-serif, system-ui, sans-serif" font-size="3.4" font-weight="800" fill="#FFFFFF">local loyalty</text>
  <text id="join-url" x="97" y="144.7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="3.2" font-weight="500" fill="#FFFFFF" text-anchor="end">{{JOIN_URL}}</text>
</svg>
