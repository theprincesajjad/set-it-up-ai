<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ui{font-family:-apple-system,'Inter',system-ui,sans-serif}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
</style>
</helmet>
<div class="ui" style="width:390px;height:844px;position:relative;overflow:hidden;background:#6B6B70">
  <div style="position:absolute;inset:0;background:#fff;opacity:.35"></div>
  <section aria-label="My card" style="position:absolute;left:0;right:0;top:64px;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 24px 0;display:flex;flex-direction:column;align-items:center">
    <div style="width:36px;height:5px;border-radius:999px;background:#E0E0DE;margin-bottom:14px"></div>
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
      <span class="disp" style="font-weight:800;font-size:17px;color:#0B0B0C">my card</span>
      <a href="Wallet.dc.html" aria-label="Close" style="width:36px;height:36px;border-radius:999px;background:#F5F5F4;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <h1 class="disp" style="margin:40px 0 0;font-weight:800;font-size:28px;line-height:32px;letter-spacing:-.01em;color:#0B0B0C;text-align:center">show this at the counter</h1>
    <p style="margin:8px 0 0;font-size:15px;color:#6B6B70;text-align:center">One card for every shop on the street.</p>

    <div role="img" aria-label="Member QR code" style="margin-top:32px;padding:18px;border-radius:20px;border:1px solid #E8E8E6;background:#fff">
      <div style="display:grid;grid-template-columns:repeat(25,8px);grid-auto-rows:8px;width:200px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
          <span style="{{c.style}}"></span>
        </sc-for>
      </div>
    </div>

    <div style="margin-top:22px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:24px;letter-spacing:.14em;font-weight:600;color:#0B0B0C">63F9 6QMF</div>
    <div style="margin-top:4px;font-size:13px;color:#6B6B70">Nikos K. · staff can type this code</div>

    <div style="margin-top:auto;width:100%;padding-bottom:30px;display:flex;flex-direction:column;gap:10px">
      <button style="height:54px;border-radius:999px;background:#0B0B0C;border:0;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:16px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"></rect><path d="M3 10h18M3 14c4 0 5 2 9 2s5-2 9-2"></path></svg>
        Add to Apple Wallet
      </button>
      <div style="display:flex;justify-content:center;gap:6px;font-size:13px;color:#6B6B70"><span>Forgot to scan?</span><a href="#" style="color:#0B0B0C;font-weight:600;text-decoration:none">Claim a purchase</a></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 25;
    const finder = (r, c, r0, c0) => {
      const y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      const edge = y === 0 || y === 6 || x === 0 || x === 6;
      const core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
      return edge || core;
    };
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const cells = [];
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        let on = finder(r, c, 0, 0);
        if (on === null) on = finder(r, c, 0, n - 7);
        if (on === null) on = finder(r, c, n - 7, 0);
        const nearFinder = (r < 8 && c < 8) || (r < 8 && c >= n - 8) || (r >= n - 8 && c < 8);
        if (on === null) on = nearFinder ? false : rnd() > 0.52;
        cells.push({ style: on ? 'background:#0B0B0C;border-radius:1.5px' : 'background:#fff' });
      }
    }
    return { cells };
  }
}
</script>
</body>
</html>
